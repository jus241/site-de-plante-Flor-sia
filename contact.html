<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site vitrine des plantes Florésia</title>
    <link rel="stylesheet" href="style/plante.css" />
    <link rel="stylesheet" href="style/accueil.css" />
    <link rel="stylesheet" href="style/contact.css" />
  </head>
  <body>
    <!-- en-tete -->
    <header>
      <h2 class="logo"><span>Florésia</span></h2>
      <nav>
        <ul>
          <li><a href="index.html">Accueil</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="plante.html">Type de plantes</a></li>
        </ul>
      </nav>

      <a href="#"
        ><img
          class="cart-shopping"
          src="images/cart-shopping-solid.png"
          alt="cart-shopping"
      /></a>
    </header>

   <main>
  <section class="contact">
    <h2>Comment nous contacter</h2>

    <div class="box-info">

      <!-- Infos -->
      <div class="info-nume">
        <div>
          <p>Numéro : +241 62 62 71 **</p>
          <p> Email : floresia@gmail.com</p>
          <p>Adresse : Libreville, Gabon</p>
          <p>Horaires : Lun - Sam / 8h - 18h</p>
        </div>
      </div>

      <!-- Formulaire -->
      <div class="form">
        <form action="" method="post">

          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom" placeholder="Nom" required />

          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" name="prenom" placeholder="Prénom" required />

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required />

          <label for="message">Message</label>
          <textarea name="message" id="message" placeholder="Votre message..." required></textarea>

          <button class="btn" type="submit">Envoyer</button>

        </form>
      </div>

    </div>
  </section>
</main>

    <!-- footer -->

    <footer>
      <div class="footer-container">
        <div class="reseau">
          <a href="#" class="reseau-footer" aria-label="Facebook"
            ><img src="images/facebook.svg" alt="facebook"
          /></a>
          <a href="#" class="reseau-footer" aria-label="TikTok"
            ><img src="images/tiktok.svg" alt="tiktok"
          /></a>
          <a href="#" class="reseau-footer" aria-label="Instagram"
            ><img src="images/instagram.svg" alt="instagram"
          /></a>
        </div>
        <div class="copyright">
          <p>&copy; 2026 VotreNom. Tous droits réservés.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
